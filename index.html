<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>총무 오피스</title>
<meta name="description" content="지금 다들 뭐 하는지 한눈에 보여요 · 업무중 · 탕비실 · 카페 · 화장실 · 옥상 · 월루중 · 연차">

<meta property="og:title" content="🏢 총무 오피스">

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#4b3f5c; --sub:#8e83a0; --panel:rgba(255,255,255,.86); --line:#eadff2; --pink:#f6b8cf; --lav:#c9b3f2; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:linear-gradient(165deg,#e6dcfa 0%,#f4e1f4 45%,#fde4ec 75%,#fde9e3 100%);}
  #nightSky{position:absolute;inset:0;background:radial-gradient(1px 1px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 37% 9%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 63% 22%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 82% 12%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 92% 34%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 6% 46%,#fff 50%,transparent 51%),linear-gradient(170deg,#1c1a3c 0%,#2a2450 55%,#433062 100%);opacity:0;pointer-events:none}
  #app{display:flex;height:100vh;width:100vw;overflow:hidden}
  #stage{position:relative;flex:1;min-width:0}
  #stage canvas{position:absolute;inset:0;display:block}
  #overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .title{position:absolute;left:18px;top:16px;background:var(--panel);backdrop-filter:blur(6px);border-radius:20px;padding:10px 18px;box-shadow:0 8px 24px rgba(160,120,200,.22);pointer-events:none}
  .title h1{margin:0;font-size:22px;font-weight:700}
  .title p{margin:2px 0 0;font-size:12.5px;color:var(--sub)}
  .title .hint{margin-top:4px;color:#b07aa8;font-weight:700}
  .workclock{position:absolute;left:50%;top:16px;display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(6px);border-radius:18px;padding:7px 10px;box-shadow:0 6px 18px rgba(160,120,200,.2);pointer-events:none;white-space:nowrap}
  .workclock .clock{margin:0;padding:4px 10px;border-radius:999px;background:#fff3c2;color:#6a4d1e;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
  .workclock .clock:empty{display:none}
  .workclock .workbar{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#8a6fa0;font-variant-numeric:tabular-nums}
  .workclock .wb{position:relative;width:118px;height:14px;border-radius:999px;background:#efe6fb;overflow:hidden}
  .workclock .wb i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#ffd6e8,#c9b6ff);transition:width .8s}
  .workclock .wb em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;color:#5a4470}
  .conn{position:absolute;right:16px;top:16px;background:var(--panel);border-radius:14px;padding:7px 12px;font-size:12.5px;box-shadow:0 6px 18px rgba(160,120,200,.2);display:flex;gap:6px;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;background:#cbbfd8;display:inline-block}
  .dot.on{background:#5fcf8f;box-shadow:0 0 0 3px rgba(95,207,143,.25)}

  .zl{position:absolute;transform:translate(-50%,-100%);background:rgba(255,255,255,.93);border-radius:16px;padding:7px 14px 7px 7px;display:flex;align-items:center;gap:9px;
      box-shadow:0 8px 22px rgba(150,110,190,.25);white-space:nowrap}
  .zl:after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:7px solid transparent;border-top-color:rgba(255,255,255,.93);border-bottom:0}
  .zl .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:16px}
  .zl b{font-size:14.5px;font-weight:700;display:block}
  .zl small{font-size:11px;color:var(--sub);display:block;margin-top:1px}
  .tag{position:absolute;transform:translate(-50%,0);font-size:10.5px;font-weight:500;background:rgba(255,255,255,.85);border-radius:8px;padding:1px 7px;white-space:nowrap;color:var(--ink)}
  .tag.me{background:#5b4a73;color:#fff}
  .tag.cat{background:rgba(255,236,206,.92);color:#7a5530}
  .bub{position:absolute;transform:translate(-50%,-100%);font-size:12px;font-weight:500;background:#fff;border-radius:12px;padding:5px 10px;white-space:nowrap;box-shadow:0 4px 12px rgba(120,90,160,.2);animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
  .bub:after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-top-color:#fff;border-bottom:0}
  .bub.shout{font-size:15px;font-weight:700;color:#e0446a;background:#fff3f6}
  .bub.shout:after{border-top-color:#fff3f6}
  .acts{display:flex;gap:7px;margin-top:8px}
  .deskRow{display:flex;gap:8px;align-items:center;margin-top:9px;font-size:13px}
  .deskRow[hidden]{display:none}
  .deskRow span{white-space:nowrap;color:var(--ink)}
  .deskRow select{flex:1;padding:6px 8px}
  .sayBox{display:flex;gap:6px;margin-top:9px}
  .sayBox[hidden]{display:none}
  .sayBox input{flex:1;min-width:0;font-family:inherit;font-size:14px;padding:8px 10px;border-radius:12px;border:1px solid var(--lav);outline:none}
  .sayBox button{font-family:inherit;font-size:14px;border:none;border-radius:12px;padding:0 12px;background:#fff1b8;cursor:pointer}
  .bub{pointer-events:auto;cursor:default;transition:opacity .15s}
  .bub:hover{opacity:.08}
  .tag{pointer-events:auto;transition:opacity .15s}
  .tag:hover{opacity:.15}
  .bub.said{background:#fffbe6;border:2px solid #ffd36e;font-weight:700;max-width:220px;white-space:normal}
  .acts[hidden]{display:none}
  .acts button{flex:1;font-family:inherit;font-size:13.5px;font-weight:500;border:none;border-radius:14px;padding:9px 6px;cursor:pointer;color:var(--ink);background:#ffe1ea;box-shadow:0 3px 0 rgba(90,60,120,.12)}
  .acts button:first-child{background:#e9e4f2}
  .heart{position:absolute;transform:translate(-50%,-50%);font-size:15px}
  @keyframes pop{from{transform:translate(-50%,-100%) scale(.5);opacity:0}to{transform:translate(-50%,-100%) scale(1);opacity:1}}

  #toasts{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{background:var(--panel);border-radius:16px;padding:8px 15px;font-size:13.5px;box-shadow:0 8px 20px rgba(150,110,190,.22);animation:pop2 .35s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop2{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  #catMenu{position:absolute;width:160px;background:#fff;border-radius:18px;padding:10px;box-shadow:0 10px 26px rgba(150,110,190,.3);display:flex;flex-direction:column;gap:6px;animation:pop2 .25s cubic-bezier(.3,1.6,.5,1)}
  #catMenu[hidden]{display:none}
  #catMenu .cn{font-size:14px;font-weight:700;text-align:center}
  #catMenu button{font-family:inherit;font-size:13.5px;border:none;border-radius:12px;padding:8px 6px;cursor:pointer;background:#ffe7c7;color:var(--ink)}
  #catMenu button[data-act=churu]{background:#ffd6e3}
  #catMenu button[data-act=play]{background:#dcd0fb}
  #catMenu .x{position:absolute;right:11px;top:7px;cursor:pointer;color:var(--sub);font-size:12px}

  #panel{width:320px;flex:none;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .sec{padding:14px 16px;border-bottom:1px solid var(--line)}
  .sec h2{margin:0 0 8px;font-size:13px;font-weight:500;color:var(--sub)}
  select{font-family:inherit;font-size:14px;width:100%;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .card{display:flex;gap:12px;align-items:center;margin-bottom:10px}
  .card img,.card .ph{width:64px;height:64px;background:#f4ecfb;border-radius:18px;flex:none}
  .card .nm{font-size:17px;font-weight:700}
  .card .st{font-size:12.5px;color:var(--sub)}
  .nmrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .mini{font-family:inherit;font-size:11.5px;border:none;border-radius:10px;padding:3px 8px;background:#f1e8fb;color:var(--ink);cursor:pointer}
  .renameBox{display:flex;gap:6px;margin:0 0 10px}
  .renameBox[hidden]{display:none}
  .renameBox input{flex:1;min-width:0;font-family:inherit;font-size:14px;padding:7px 10px;border-radius:10px;border:1px solid var(--lav);outline:none}
  .renameBox button{font-family:inherit;font-size:13px;border:none;border-radius:10px;padding:7px 10px;background:#c9b3f2;color:#fff;cursor:pointer}
  .renameBox button.cancel{background:#eee6f6;color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
  .sbtn{font-family:inherit;font-size:13.5px;font-weight:500;border:none;border-radius:14px;padding:9px 6px;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 rgba(90,60,120,.12);transition:transform .08s}
  .sbtn:active{transform:translateY(2px)}
  .sbtn.cur{outline:2px solid var(--ink);outline-offset:-2px}
  .sbtn.wide{grid-column:span 2}
  #list{flex:1;overflow:auto;padding:6px 8px}
  .row{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:14px;cursor:pointer}
  .row:hover{background:#f6effb}
  .row.sel{background:#efe4fa}
  .row img{width:38px;height:38px;flex:none}
  .row .nm{flex:1;font-size:13.5px}
  .row .me{font-size:10px;background:var(--ink);color:#fff;border-radius:8px;padding:1px 6px;margin-left:4px}
  .chip{font-size:11.5px;border-radius:10px;padding:3px 8px;white-space:nowrap}
  .counts{display:flex;flex-wrap:wrap;gap:5px}
  .foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px}
  .foot button{flex:1;font-family:inherit;font-size:13px;border:none;border-radius:14px;padding:9px 6px;background:#f1e8fb;color:var(--ink);cursor:pointer}
  .foot button.on{background:#c9efd8}
  .foot button.warn{background:#ffd3dc}
  .joinBtn{margin-top:8px;width:100%;font-family:inherit;font-size:14px;font-weight:700;border:none;border-radius:14px;padding:11px 8px;background:linear-gradient(135deg,#d9c6ff,#ffc9de);color:var(--ink);cursor:pointer}
  .joinBtn:disabled{opacity:.55;cursor:default}
  .joinNote{font-size:12px;color:var(--sub,#8a80a0);margin-top:6px}
  #loading{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:var(--sub)}
  @media (max-width:820px){
    #app{flex-direction:column;height:auto;min-height:100vh;overflow:visible}
    #stage{height:64vh;flex:none}
    #panel{width:100%;border-left:none;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="loading">사무실 짓는 중…</div>
    <div id="overlay"></div>
    <div class="title"><h1>🏢 총무 오피스</h1><p>상태를 바꾸면 그 구역으로 걸어가요 · 고양이를 눌러보세요 🐾 · 드래그로 회전</p><p class="hint">캐릭터가 안보이면 F5키를 눌러주세요</p><p class="hint">버벅이면 🪶 가볍게 보기를 눌러주세요</p></div>
    <div class="workclock"><div class="workbar" id="workBar"><span>09:00</span><div class="wb"><i id="wbFill"></i><em id="wbPct"></em></div><span>18:00</span></div><p class="clock" id="offClock"></p></div>
    <div class="conn"><span class="dot" id="connDot"></span><span id="connText">혼자 보는 중</span></div>
    <div id="catMenu" hidden><div class="cn">🐾</div><button data-act="pet">🖐️ 쓰다듬기</button><button data-act="churu">🍡 츄르 주기</button><button data-act="play">🪶 놀아주기</button><span class="x">✕</span></div>
    <div id="toasts"></div>
  </div>
  <aside id="panel">
    <div class="sec"><h2>내 캐릭터</h2><select id="meSel"></select><button class="joinBtn" id="joinBtn" hidden>➕ 내 캐릭터 만들기</button><div class="joinNote" id="joinNote" hidden></div></div>
    <div class="sec">
      <div class="card"><div class="ph" id="selPh"></div><div><div class="nmrow"><span class="nm" id="selName">-</span><button class="mini" id="renameBtn" hidden>✏️ 이름 바꾸기</button><button class="mini" id="rerollBtn" hidden>🎲 외모 바꾸기</button></div><div class="st" id="selStatus">-</div></div></div>
      <form class="renameBox" id="renameBox" hidden><input id="nameIn" maxlength="12" placeholder="새 이름 (최대 12자)" autocomplete="off"><button type="submit">저장</button><button type="button" class="cancel" id="renameCancel">취소</button></form>
      <div class="grid" id="statusGrid"></div>
      <div class="st" id="lockNote" hidden style="margin-top:8px"></div>
      <div class="deskRow" id="deskRow" hidden><span>🪑 내 자리</span><select id="deskSel"></select></div>
      <form class="sayBox" id="sayBox" hidden><input id="sayIn" maxlength="40" placeholder="💬 말풍선에 할 말 (40자)" autocomplete="off"><button type="submit">말하기</button></form>
      <div class="acts" id="roofActs" hidden><button data-a="smoke">🚬 담타</button><button data-a="shout">📢 소리지르기</button></div>
    </div>
    <div class="sec"><h2>구역별 인원</h2><div class="counts" id="counts"></div></div>
    <div id="list"></div>
    <form class="renameBox" id="ririBox" hidden style="padding:8px 12px 0"><input id="ririPw" type="password" placeholder="리리 비밀번호" autocomplete="current-password"><button type="submit">로그인</button><button type="button" class="cancel" id="ririCancel">취소</button></form>
    <div class="foot">
      <button id="ririBtn" hidden>👑 리리 로그인</button>
      <button id="liteBtn">🪶 가볍게 보기</button>
      <button id="simBtn">🤖 자동 시뮬레이션</button>
      <button id="regenBtn">🎲 새로 뽑기</button>
      <button id="delBtn" hidden>🗑 캐릭터 지우기</button>
    </div>
  </aside>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }
</script>
<script type="module" src="./firebase-shim.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ================================================================ 기본 데이터
const STATUSES = [
  { key:'commute', label:'출근중', emoji:'🚌', color:[48,90,80], ic:'#fff3c2', sub:'버스 타고 출근하는 중',
    lines:['지각이다…','버스 꽉 찼네','월요일 싫어…','5분만 더 자고 싶다','기사님 빨리요!'] },
  { key:'work',   label:'업무중', emoji:'💻', color:[255,70,85], ic:'#e6dcff', sub:'자리에서 열일 중',
    lines:['타닥타닥…','이 메일만 보내고','엑셀 지옥','집중 모드!','결재 올렸어요','잔액 부족..하아..','여보세요','수납완료','퇴사하고싶다','누적초과요','서명누락..','청약서분실 두둥','보완이요'] },
  { key:'shred', label:'파쇄기', emoji:'📄', color:[220,30,88], ic:'#e9e6f2', sub:'종이파쇄기 앞에서 파쇄 중',
    lines:['종이 꽉찼네','또 고장이야','아악 청약서 원본 갈았어!'] },
  { key:'pantry', label:'탕비실', emoji:'☕', color:[28,90,86], ic:'#ffe6cf', sub:'모여 앉아 수다 · 커피',
    lines:['커피 한 잔 할까요?','어제 그거 봤어요?','ㅋㅋㅋㅋ','간식 누가 사왔어요?','믹스커피 최고'] },
  { key:'cafe',   label:'카페',   emoji:'🧋', color:[150,55,84], ic:'#d6f5e6', sub:'커피 사고 마시는 중',
    lines:['아아 하나요!','오늘은 라떼','여기 빵 맛있어요','디카페인으로…','샷 추가요!'] },
  { key:'toilet', label:'화장실', emoji:'🚻', color:[195,75,85], ic:'#d8f0fb', sub:'잠깐 자리 비움',
    lines:['잠깐만요!','급해요…','손 씻기 30초','휴…'] },
  { key:'roof',   label:'옥상',   emoji:'🌤️', color:[340,85,88], ic:'#ffdbe8', sub:'바람 쐬는 중',
    lines:['바람 좋다~','기지개 쭉','하늘 예쁘다','5분만 쉬자'] },
  { key:'loaf', label:'월루중', emoji:'🐾', color:[30,90,85], ic:'#ffeacc', sub:'고양이 놀이터에서 냥이랑 노는 중',
    lines:['고양이 최고…','잠깐 힐링 중','츄르 먹을래?','일은 이따가…','냥냥~'] },
  { key:'stroll', label:'산책', emoji:'🌳', color:[120,45,85], ic:'#dcf5d4', sub:'산책로 한 바퀴 도는 중',
    lines:['산책 최고~','바람 시원하다','만보 채우는 중','머리 식히는 중','꽃 예쁘다 🌼','한 바퀴만 더!'] },
  { key:'vacation', label:'연차', emoji:'🛏️', color:[45,90,85], ic:'#fff0c4', sub:'침대에서 푹 쉬는 중',
    lines:['연차 최고!','연락하지 마세요~','푹 자는 중…','오늘은 쉽니다'] },
];
const SBYKEY = Object.fromEntries(STATUSES.map(s => [s.key, s]));
const RIRI_ID = 'riri';
const SHOUTS = ['으아아아악!!!','퇴근하고 싶다!!!','월급 올려줘!!!','왜 나만!!!','아 몰라!!!','주말 언제 와!!!','야호~~~!!'];
const CHAT = ['ㅋㅋㅋ','진짜요?','헐','그니까요','어제 회식…','주말에 뭐해요?','맛있다','오~','ㅎㅎ'];

const rand = (a,b) => a + Math.random()*(b-a);
const randi = (a,b) => Math.floor(rand(a,b+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const chance = p => Math.random() < p;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const uid = () => Math.random().toString(36).slice(2,10);
const cssHsl = (c, dl=0) => `hsl(${c[0]},${c[1]}%,${clamp(c[2]+dl,0,100)}%)`;

// ================================================================ three 기본
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.shadowMap.enabled = true;

const ADJ = {}; for (const k in NODES) ADJ[k] = [];
for (const [a,b] of EDGES){ const d = Math.hypot(NODES[a][0]-NODES[b][0], NODES[a][2]-NODES[b][2]); ADJ[a].push([b,d]); ADJ[b].push([a,d]); }
function shortest(a,b){
  const dist = {}, prev = {}, q = new Set(Object.keys(NODES));
  for (const k of q) dist[k] = Infinity; dist[a] = 0;
  while (q.size) { let u=null; for (const k of q) if (u===null || dist[k]<dist[u]) u=k; q.delete(u); if (u===b) break; for (const [v,d] of ADJ[u]) if (dist[u]+d < dist[v]) { dist[v]=dist[u]+d; prev[v]=u; } }
  const path = []; let u = b; while (u) { path.unshift(u); if (u===a) break; u = prev[u]; } return path;
}

const overlay = document.getElementById('overlay');
const charGroup = new THREE.Group(); scene.add(charGroup);

function freeSlot(c){ if (c.slot) { releaseCat(c.slot); c.slot.occ = null; c.slot = null; } c.action = null; }
function claimSlot(c, zone){
  if (zone === 'work' && SLOTS.work[c.deskIdx]) { const s = SLOTS.work[c.deskIdx]; s.occ = c.id; return s; }
  const mine = SLOTS[zone].find(s => s.only === c.id);
  if (mine) { mine.occ = c.id; return mine; }
  const free = SLOTS[zone].filter(s => !s.occ && !s.only);
  let s = free.length ? pick(free) : null;
  if (!s) { // 자리 없으면 근처에 서 있기
    const base = SLOTS[zone][0];
    s = { pos:[base.pos[0]+rand(-1,1), base.pos[1], base.pos[2]+rand(.6,1.2)], ry:Math.PI, pose: zone==='toilet'?'wait':'chatStand', via:base.via, approach:[], zone, temp:true };
  }
  s.occ = c.id; return s;
}

function buildChars(list){
  for (const c of chars) { charGroup.remove(c.m.root); c.tag.remove(); if (c.bub) c.bub.remove(); }
  for (const k in SLOTS) SLOTS[k].forEach(s => s.occ = null);
  BUSES.forEach(B => B.seats.forEach(s => s.occ = null));
  const order = [...Array(SLOTS.work.length).keys()].sort(() => Math.random()-.5);
  chars = list.map((d, i) => {
    const m = buildModel(d.look);
    m.root.traverse(o => { o.userData.charId = d.id; });
    charGroup.add(m.root);
    const tag = document.createElement('div'); tag.className = 'tag'; overlay.appendChild(tag);
    const c = { ...d, m, tag, deskIdx: -1, deskPref: Number.isInteger(d.desk) && d.desk >= 0 && d.desk < SLOTS.work.length ? d.desk : -1, path:[], pose:'idle', t0:Math.random()*10, cur:{}, bub:null, bubUntil:0, nextShuffle: rand(12,30) };
    return c;
  });
  // 책상 중복 방지
  const used = new Set();
  for (const c of chars) if (c.deskPref >= 0 && !used.has(c.deskPref)) { c.deskIdx = c.deskPref; used.add(c.deskPref); }   // 고른 자리 먼저
  let nx = 0; for (const c of chars) if (c.deskIdx < 0) { while (used.has(nx)) nx++; c.deskIdx = nx; used.add(nx); }      // 나머지는 앞자리부터
  for (const c of chars) { const s = claimSlot(c, c.status); placeAt(c, s); }
  if (!chars.find(c => c.id === selectedId)) selectedId = null;
  if (!chars.find(c => c.id === meId)) meId = null;
  makePortraits(); renderPanel(true);
}
function hashIdx(id, i){ let h = 0; for (const ch of id) h = (h*31 + ch.charCodeAt(0)) >>> 0; return (h + i) % SLOTS.work.length; }

  c.slot = s; c.path = []; c.pose = s.pose; if (s.catSpot) setTimeout(() => summonCat(s, c), 50); c.m.root.position.set(s.pos[0], s.pos[1], s.pos[2]); c.m.root.rotation.y = s.ry;
}
function extendLoop(c){ // 산책로 계속 돌기
  if (!c.onLoop) { c.onLoop = true; c.loopA = c.slot.a; }

    let done = false, seeded = false;
    const timer = setTimeout(() => { if (!done) { done = true; resolve(false); } }, 10000);
    DB.collection('chars').onSnapshot(snap => {
      if (snap.metadata && snap.metadata.fromCache && snap.empty) return;
      if (snap.empty) {
        if (isOwner && !seeded) { seeded = true; seedDb(); }
        else if (!done && !isOwner) { done = true; clearTimeout(timer); resolve(false); }
        return;
      }
      applyDbSnapshot(snap);
      // 주인이 들어오면 리리는 항상 주인 것
      if (isOwner && myUid && charOwner[RIRI_ID] !== myUid && !seeded) { seeded = true; charOwner[RIRI_ID] = myUid; dbWrite(RIRI_ID, { owner:myUid }); }
      if (!done) { done = true; clearTimeout(timer); resolve(true); }
    }, err => { if (!done) { done = true; clearTimeout(timer); resolve(false); } else toast('⚠️ 서버 연결이 끊겼어요. 새로고침해 주세요'); });
  });
}

const saved = loadLocal();
if (saved && saved.list.every(d => SBYKEY[d.status])) roster = { ver:saved.ver, fresh:false, list:ensureRiri(saved.list) };
else { const list = ensureRiri(makeRoster(10)); roster = { ver:Date.now(), fresh:true, list }; }
try { meId = localStorage.getItem(LS_ME) || RIRI_ID; } catch(e){ meId = RIRI_ID; }
if (window.claude && typeof window.claude.use === 'function') meId = null; // 서버 모드: 서버가 알려줄 때까지 '나' 없음
resize();
const hasClaude = !!(window.claude && typeof window.claude.use === 'function');
if (!hasClaude) { buildChars(roster.list); if (meId && chars.find(c => c.id === meId)) selectedId = meId; renderPanel(); }
initSync();
document.getElementById('loading').textContent = '사무실 불러오는 중…';
(async () => {
  const ok = hasClaude ? await initDb() : false;
  if (!ok) {
    dbMode = false;
    if (!chars.length) { buildChars(roster.list); if (meId && chars.find(c => c.id === meId)) selectedId = meId; renderPanel(true); }
    if (hasClaude) toast('혼자 보기 모드로 열었어요 (서버에 연결되지 않음)');
  } else { const dot = $('connDot'), txt = $('connText'); dot.classList.add('on'); txt.textContent = canWrite ? '모두와 실시간 공유 중' : '보기 전용으로 공유 중'; }
  const ld = document.getElementById('loading'); if (ld) ld.remove();
})();
window.__office = { get chars(){ return chars; }, cats, setStatus, triggerAction, SLOTS, camera, controls, BUS, BUSES, sim(sec){ for (let i=0;i<sec*20;i++){ const tt=performance.now()/1000+i*.05; stepBus(.05); stepChars(tt,.05); stepCats(tt,.05); } } };
requestAnimationFrame(t => { last = t; frame(t); });
</script>
